<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест: Медицинская физика (115 вопросов)</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14181f;--mut:#5d6675;--bd:#dde2e9;--ac:#0f766e;--acx:#fff;--ok:#0f7a3d;--okb:#e4f5eb;--no:#b3261e;--nob:#fcebea;--sel:#dff2f0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1217;--card:#161b22;--tx:#eceff4;--mut:#9aa4b2;--bd:#29303a;--ac:#2dd4bf;--acx:#06201d;--ok:#4ade80;--okb:#12301f;--no:#ff8a80;--nob:#3a1816;--sel:#12302d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1217;--card:#161b22;--tx:#eceff4;--mut:#9aa4b2;--bd:#29303a;--ac:#2dd4bf;--acx:#06201d;--ok:#4ade80;--okb:#12301f;--no:#ff8a80;--nob:#3a1816;--sel:#12302d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.mut{color:var(--mut)}
.hero{text-align:center;padding-top:12vh}.hero h1{margin:8px 0;font-size:28px}.badge{font-size:48px}
.chk{display:flex;gap:8px;justify-content:center;align-items:center;margin:20px 0;color:var(--mut)}
.btn{display:block;width:100%;margin:8px 0;padding:14px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 16px inherit;font-family:inherit}
.btn.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}.btn:disabled{opacity:.4}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.lnk{background:none;border:0;color:var(--ac);font:600 15px inherit;font-family:inherit;padding:6px 0}
.bar{height:6px;border-radius:3px;background:var(--bd);margin:8px 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.q{font-size:19px;line-height:1.4;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin:0 0 10px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:16px/1.4 inherit;font-family:inherit}
.opt b,.ro b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:13px}
.opt.sel{border-color:var(--ac);background:var(--sel)}.opt.sel b{background:var(--ac);color:var(--acx)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin:6px 0 14px}
.cell{padding:10px 0;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 14px inherit;font-family:inherit}
.cell.on{background:var(--sel);border-color:var(--ac)}.cell.cur{outline:2px solid var(--ac)}
.score{text-align:center;padding:10px 0 4px}.big{font-size:44px;font-weight:800}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:10px 0;font-weight:600}
.ok{color:var(--ok)}.no{color:var(--no)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;gap:8px;padding:10px 0;background:var(--bg)}
.tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 14px inherit;font-family:inherit}
.tab.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 12px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chip{font-size:13px;font-weight:700}.chip.ok{color:var(--ok)}.chip.no{color:var(--no)}
.cq{font-weight:600;margin-bottom:10px}
.ro{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin:4px 0;border-radius:10px;border:1.5px solid transparent;font-size:15px}
.ro.right{background:var(--okb);border-color:var(--ok)}.ro.wrong{background:var(--nob);border-color:var(--no)}
.ro em{display:block;font-style:normal;font-size:13px;font-weight:700;margin-top:2px}
.ro.right em{color:var(--ok)}.ro.wrong em{color:var(--no)}
.note{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--bd);font-size:13px}
</style>
</head>

<div id="app"></div>
<script>

const N=Q.length,KEY='medphys115-v1',app=document.getElementById('app');
let st=null,flt='all',grid=false;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const load=()=>{try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}};
const toTop=()=>window.scrollTo(0,0);

function home(){
  const s=load(),has=s&&!s.done&&s.order&&s.order.length;
  app.innerHTML=`<div class="wrap hero"><div class="badge">🩺</div><h1>Медицинская физика</h1>
  <p class="mut">${N} вопросов, в каждом один правильный ответ. Разбор верных и неверных ответов появится после теста.</p>
  <label class="chk"><input type="checkbox" id="shuf"> Перемешать вопросы</label>
  ${has?`<button class="btn pri" onclick="resume()">Продолжить (отвечено ${Object.keys(s.ans).length} из ${s.order.length})</button>`:''}
  <button class="btn ${has?'':'pri'}" onclick="begin()">${has?'Начать заново':'Начать тест'}</button></div>`;
}
const begin=()=>startQuiz(Q.map((_,i)=>i),$('shuf').checked);
function startQuiz(list,shuf){
  const o=list.slice();
  if(shuf)for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
  st={order:o,ans:{},pos:0,done:false};grid=false;save();showQ();toTop();
}
function resume(){st=load();grid=false;showQ()}
function showQ(){
  const qi=st.order[st.pos],q=Q[qi],n=st.order.length,a=st.ans[qi],cnt=Object.keys(st.ans).length,last=st.pos===n-1;
  app.innerHTML=`<div class="wrap">
  <div class="top"><span>Вопрос ${st.pos+1} из ${n}</span><button class="lnk" onclick="toggleGrid()">${grid?'К вопросу':'Список'}</button></div>
  <div class="bar"><i style="width:${(cnt/n*100).toFixed(1)}%"></i></div>
  ${grid?gridHtml():`<h2 class="q">${esc(q.q)}</h2>
  ${q.opts.map((o,j)=>`<button class="opt${a===j?' sel':''}" onclick="pick(${j})"><b>${j+1}</b><span>${esc(o)}</span></button>`).join('')}
  <div class="nav"><button class="btn" ${st.pos?'':'disabled'} onclick="go(-1)">Назад</button>
  <button class="btn pri" onclick="${last?'finish()':'go(1)'}">${last?'Завершить':'Далее'}</button></div>`}
  </div>`;
}
function gridHtml(){
  const un=st.order.filter(i=>st.ans[i]===undefined).length;
  return `<div class="grid">${st.order.map((qi,p)=>`<button class="cell${st.ans[qi]!==undefined?' on':''}${p===st.pos?' cur':''}" onclick="jump(${p})">${p+1}</button>`).join('')}</div>
  <p class="mut">Без ответа: ${un}</p><button class="btn pri" onclick="finish()">Завершить тест</button>`;
}
function pick(j){st.ans[st.order[st.pos]]=j;save();showQ()}
function go(d){st.pos+=d;save();showQ();toTop()}
function jump(p){st.pos=p;grid=false;save();showQ();toTop()}
function toggleGrid(){grid=!grid;showQ();toTop()}
function finish(){st.done=true;grid=false;flt='all';save();showRes();toTop()}
function setF(k){flt=k;showRes();toTop()}
function retryBad(){startQuiz(st.order.filter(i=>st.ans[i]!==Q[i].a),false)}
function card(r){
  const q=r.q;
  return `<div class="card"><div class="ch"><b>Вопрос №${q.n}</b><span class="chip ${r.ok?'ok':'no'}">${r.ok?'✓ Верно':r.skip?'— Нет ответа':'✗ Неверно'}</span></div>
  <div class="cq">${esc(q.q)}</div>
  ${q.opts.map((o,j)=>{const right=j===q.a,mine=j===r.c;
    return `<div class="ro${right?' right':mine?' wrong':''}"><b>${j+1}</b><span>${esc(o)}${right?`<em>✓ Правильный ответ${mine?' · ваш выбор':''}</em>`:mine?'<em>✗ Ваш ответ</em>':''}</span></div>`}).join('')}
  ${q.note?`<p class="note">${esc(q.note)}</p>`:''}</div>`;
}
function showRes(){
  const rows=st.order.map(qi=>{const q=Q[qi],c=st.ans[qi];return{q,c,ok:c===q.a,skip:c===undefined}});
  const good=rows.filter(r=>r.ok).length,skip=rows.filter(r=>r.skip).length,bad=rows.length-good-skip;
  const shown=rows.filter(r=>flt==='all'||(flt==='ok'?r.ok:!r.ok));
  app.innerHTML=`<div class="wrap"><div class="score"><div class="big">${good} / ${rows.length}</div>
  <div class="mut">${Math.round(good/rows.length*100)}% верных ответов</div>
  <div class="stats"><span class="ok">✓ Верно: ${good}</span><span class="no">✗ Неверно: ${bad}</span><span class="mut">— Пропущено: ${skip}</span></div></div>
  <button class="btn pri" onclick="startQuiz(Q.map((_,i)=>i),false)">Пройти заново</button>
  ${good<rows.length?`<button class="btn" onclick="retryBad()">Работа над ошибками (${rows.length-good})</button>`:''}
  <button class="btn" onclick="home()">В начало</button>
  <div class="tabs">${[['all','Все'],['bad','Ошибки'],['ok','Верные']].map(([k,t])=>`<button class="tab${flt===k?' on':''}" onclick="setF('${k}')">${t}</button>`).join('')}</div>
  ${shown.map(card).join('')||'<p class="mut">Здесь пока ничего нет.</p>'}</div>`;
}
const s0=load();
if(s0&&s0.done&&s0.order){st=s0;showRes()}else home();
</script>
